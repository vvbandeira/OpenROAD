# Bazel downloader rewrites. See
# https://bazel.build/reference/command-line-reference#flag--downloader_config
# Patterns match the URL without its scheme. When several rewrites match,
# Bazel tries the results in order. The registry integrity hash still applies.

# bliss (a scip dependency): the BCR source URL on users.aalto.fi stopped
# resolving. Keep it first and fall back to the Internet Archive copy.
rewrite (users\.aalto\.fi/~tjunttil/bliss/downloads/.*) $1
rewrite users\.aalto\.fi/(~tjunttil/bliss/downloads/.*) web.archive.org/web/2025id_/https://users.aalto.fi/$1
